<div class="container flow-grid">
  <div class="flow-copy">
    <span class="kicker" data-key="flow_kicker"></span>
    <h2 class="sec-title" data-key="flow_title"></h2>
    <p class="sec-lead" data-key="flow_lead"></p>
    <div class="flow-steps">
      <div><b data-key="flow_s1_t"></b><span data-key="flow_s1_p"></span></div>
      <div><b data-key="flow_s2_t"></b><span data-key="flow_s2_p"></span></div>
      <div><b data-key="flow_s3_t"></b><span data-key="flow_s3_p"></span></div>
    </div>
  </div>

  <div class="robot-cell" aria-label="Fertigungsprozess: Teile werden gesammelt, bearbeitet und geliefert">
    <div class="robot-arm">
      <span class="arm-base"></span>
      <span class="arm-joint"></span>
      <span class="arm-link link-one"></span>
      <span class="arm-link link-two"></span>
      <span class="gripper"></span>
    </div>
    <div class="part-stream">
      <span class="part part-1"></span>
      <span class="part part-2"></span>
      <span class="part part-3"></span>
      <span class="part part-4"></span>
      <span class="part part-5"></span>
    </div>
    <div class="process-rail">
      <span data-key="flow_rail1"></span>
      <span data-key="flow_rail2"></span>
      <span data-key="flow_rail3"></span>
      <span data-key="flow_rail4"></span>
    </div>
    <div class="finished-bin">
      <b data-key="flow_bin_t"></b>
      <span data-key="flow_bin_s"></span>
    </div>
  </div>
</div>
