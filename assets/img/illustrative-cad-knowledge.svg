<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 980" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative CAD workspace for CNC knowledge</title>
  <desc id="desc">A bright technical CAD workspace with a turned part outline, dimensions and machining reference lines. It is illustrative and contains no customer data.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafdfe"/><stop offset="1" stop-color="#e7f0f4"/></linearGradient>
    <pattern id="minorGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#91aab5" stroke-opacity=".17" stroke-width="1"/></pattern>
    <pattern id="majorGrid" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#567785" stroke-opacity=".24" stroke-width="1.3"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#e6000b"/></marker>
  </defs>
  <rect width="1920" height="980" fill="url(#paper)"/>
  <rect width="1920" height="980" fill="url(#minorGrid)"/>
  <rect width="1920" height="980" fill="url(#majorGrid)"/>
  <g fill="none" stroke="#7d9daa" stroke-opacity=".38" stroke-width="1.5"><path d="M0 146H458L578 266H1280"/><path d="M0 840H396L578 658H1920"/><circle cx="1544" cy="238" r="98"/><circle cx="1544" cy="238" r="46"/><path d="M1446 238H1642M1544 140V336"/></g>
  <g transform="translate(514 285)" fill="none"><path d="M0 180H112V140H208V88H370V128H474V58H754V104H876V178H1004V238H876V312H754V362H474V292H370V332H208V280H112V240H0Z" fill="#d7e7ec" fill-opacity=".62" stroke="#173b4c" stroke-width="4"/><path d="M0 210H1004" stroke="#4a7080" stroke-dasharray="12 10" stroke-width="2"/><path d="M112 140V280M208 88V332M370 128V292M474 58V362M754 104V312M876 178V238" stroke="#5d8392" stroke-width="1.5"/><path d="M508 74V346M720 120V296" stroke="#e6000b" stroke-width="4"/><circle cx="614" cy="210" r="84" stroke="#2e667a" stroke-width="2"/><circle cx="614" cy="210" r="42" stroke="#2e667a" stroke-width="2"/><circle cx="614" cy="210" r="10" fill="#e6000b" stroke="none"/></g>
  <g fill="none" stroke="#e6000b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M514 236V158H884"/><path d="M988 285V168H1360"/><path d="M1420 490H1740V396"/><path d="M1000 690H1280V788"/></g>
  <g fill="#173b4c" font-family="monospace" font-size="18" font-weight="700" letter-spacing="1.1"><text x="532" y="143">REFERENCE AXIS</text><text x="1010" y="152">TURN-MILL FEATURE</text><text x="1458" y="373">MEASUREMENT POINT</text><text x="1018" y="821">SURFACE REQUIREMENT</text></g>
  <g fill="#52717e" font-family="monospace" font-size="15" letter-spacing="1.2"><text x="78" y="74">OSMP / ILLUSTRATIVE CAD VIEW</text><text x="78" y="914">GEOMETRY · MATERIAL · TOLERANCE · DRAWING DATA</text></g>
  <g opacity=".93"><rect x="1470" y="530" width="300" height="190" fill="#f7fbfc" stroke="#8ba8b3"/><rect x="1494" y="556" width="118" height="10" fill="#e6000b"/><rect x="1494" y="592" width="228" height="9" fill="#476e7d"/><rect x="1494" y="620" width="180" height="9" fill="#9bb2bb"/><rect x="1494" y="660" width="95" height="24" fill="none" stroke="#476e7d"/><rect x="1606" y="660" width="116" height="24" fill="none" stroke="#9bb2bb"/></g>
  <rect x="-240" y="0" width="160" height="980" fill="#ffffff" fill-opacity=".55"><animate attributeName="x" values="-240;2160" dur="11s" repeatCount="indefinite"/></rect>
</svg>
