<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative CNC CAD blueprint background</title>
  <desc id="desc">A dark technical drawing with a turned shaft contour, dimensions and machining reference lines. This is an illustrative placeholder, not a customer drawing.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d2b"/>
      <stop offset="0.52" stop-color="#0a2838"/>
      <stop offset="1" stop-color="#04131e"/>
    </linearGradient>
    <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7fa8ba" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#b1c9d4" stroke-opacity=".18" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#f14c55"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#surface)"/>
  <rect width="1920" height="1080" fill="url(#microGrid)"/>
  <rect width="1920" height="1080" fill="url(#majorGrid)"/>

  <g fill="none" stroke="#72b5c9" stroke-opacity=".25" stroke-width="1.5">
    <path d="M0 112H548L688 252H1920"/>
    <path d="M0 238H448L628 418H1920"/>
    <path d="M0 844H526L692 678H1920"/>
    <path d="M0 968H454L668 754H1920"/>
    <circle cx="1594" cy="228" r="94"/>
    <circle cx="1594" cy="228" r="55"/>
    <path d="M1500 228H1688M1594 134V322"/>
  </g>

  <g transform="translate(412 252)">
    <path d="M0 216H136V178H232V130H390V166H490V96H834V142H960V218H1112V278H960V354H834V400H490V330H390V366H232V318H136V280H0Z" fill="#123b4b" fill-opacity=".25" stroke="#d7f5ff" stroke-width="5" filter="url(#glow)"/>
    <path d="M0 216H136V178H232V130H390V166H490V96H834V142H960V218H1112V278H960V354H834V400H490V330H390V366H232V318H136V280H0" fill="none" stroke="#9ce7f5" stroke-width="2.2"/>
    <path d="M0 248H1112" stroke="#8bd0df" stroke-dasharray="10 10" stroke-width="2"/>
    <path d="M136 178V318M232 130V366M390 166V330M490 96V400M834 142V354M960 218V278" stroke="#93d9e6" stroke-opacity=".72" stroke-width="1.5"/>
    <path d="M490 112V384M834 158V338" stroke="#e73742" stroke-width="4" stroke-opacity=".9"/>
    <path d="M524 126H800M524 370H800" stroke="#e8fbff" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="662" cy="248" r="95" fill="none" stroke="#6bc8dd" stroke-width="2"/>
    <circle cx="662" cy="248" r="51" fill="none" stroke="#6bc8dd" stroke-width="2"/>
    <circle cx="662" cy="248" r="11" fill="#e73742"/>
  </g>

  <g fill="none" stroke="#f14c55" stroke-width="2" stroke-opacity=".95">
    <path d="M412 178V98H748" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M902 240V120H1246" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M1590 470H1810V388" marker-end="url(#arrow)"/>
    <path d="M1294 700H1524V794" marker-end="url(#arrow)"/>
    <path d="M558 830H270V922" marker-end="url(#arrow)"/>
  </g>

  <g fill="#e5f8fb" font-family="monospace" font-size="18" font-weight="700" letter-spacing="1.4">
    <text x="430" y="83">REFERENCE A / TURNING AXIS</text>
    <text x="920" y="105">TURN-MILL FEATURE</text>
    <text x="1540" y="365">TOOL PATH</text>
    <text x="1306" y="827">SURFACE AREA</text>
    <text x="66" y="952">DRAWING INPUT</text>
  </g>
  <g fill="#b3d7df" font-family="monospace" font-size="15" letter-spacing="1.2" opacity=".84">
    <text x="74" y="62">OSMP / ILLUSTRATIVE CAD VIEW</text>
    <text x="74" y="1002">CNC TURNING · TURN-MILLING · REQUEST PREPARATION</text>
    <text x="1580" y="1002">NOT A CUSTOMER DRAWING</text>
  </g>

  <g opacity=".88">
    <rect x="1532" y="535" width="286" height="178" fill="#071a26" fill-opacity=".83" stroke="#6caabc" stroke-opacity=".55"/>
    <rect x="1554" y="560" width="108" height="12" fill="#e73742"/>
    <rect x="1554" y="592" width="220" height="9" fill="#b5e6ef" fill-opacity=".75"/>
    <rect x="1554" y="618" width="177" height="9" fill="#b5e6ef" fill-opacity=".45"/>
    <rect x="1554" y="654" width="92" height="22" fill="none" stroke="#93d7e5" stroke-opacity=".75"/>
    <rect x="1662" y="654" width="112" height="22" fill="none" stroke="#93d7e5" stroke-opacity=".45"/>
  </g>
</svg>
