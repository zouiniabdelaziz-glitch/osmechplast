<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 172" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">OSMP OS.Mechplast</title>
  <desc id="logoDesc">Horizontales OSMP Logo mit CNC-Werkzeugkopf, Wortmarke und OS.Mechplast Subline.</desc>
  <style>
    .word,
    .sub {
      font-family: Bahnschrift, "DIN Condensed", "Aptos Display", "Arial Narrow", Arial, sans-serif;
      text-rendering: geometricPrecision;
    }

    .word {
      fill: #111111;
      font-size: 84px;
      font-weight: 900;
      letter-spacing: -1.4px;
    }

    .sub {
      fill: #8f9094;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 6px;
    }

    .tool-main { fill: #111111; }
    .tool-side { fill: #2b2b2d; opacity: .86; }
    .accent { fill: #f28c28; }
    .rule { stroke: #8f9094; stroke-width: 3; stroke-linecap: square; }
    .rule-accent { stroke: #f28c28; stroke-width: 3; stroke-linecap: square; }
  </style>

  <g transform="translate(20 17)">
    <path class="tool-main" d="M18 24h76l14 48H82v33l-15 24v18H51v-18l-15-24V72H6z"/>
    <path class="tool-side" d="M82 72h26l-12 10H82z"/>
    <rect class="accent" x="54" y="147" width="10" height="15"/>
    <path class="rule" d="M41 166h36"/>
  </g>

  <g transform="translate(152 0)">
    <text class="word" x="0" y="91" textLength="382" lengthAdjust="spacingAndGlyphs">OSMP</text>
    <text class="sub" x="2" y="132" textLength="378" lengthAdjust="spacingAndGlyphs">OS.MECHPLAST</text>
    <path class="rule" d="M2 149h378"/>
    <path class="rule-accent" d="M2 149h52"/>
  </g>
</svg>
