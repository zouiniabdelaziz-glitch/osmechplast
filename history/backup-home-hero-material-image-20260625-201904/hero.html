<div class="hero-cad-scene">
  <div class="hero-cad-art" aria-hidden="true">
    <img src="assets/img/hero-cnc-blueprint.svg" alt="">
  </div>
  <div class="hero-cad-overlay" aria-hidden="true"></div>

  <div class="container hero-cad-content hero-cad-content--assistant">
    <div class="hero-copy">
      <span class="hero-eyebrow" data-key="hero_eyebrow"></span>
      <h1 data-key="hero_h1_html"></h1>
      <p class="hero-sub" data-key="hero_sub"></p>
    </div>

    <form class="request-assistant" id="requestAssistant">
      <div class="request-assistant__head">
        <span class="kicker">Anfrage-Assistent</span>
        <h2>Ihr CNC-Teil vorbereiten.</h2>
        <p>Vier Angaben reichen f&uuml;r den Start. Im n&auml;chsten Schritt erg&auml;nzen Sie Ihre Kontaktdaten und Zeichnung.</p>
      </div>

      <div class="assistant-field">
        <label for="assistantService">Welche Bearbeitung wird ben&ouml;tigt?</label>
        <select id="assistantService" name="service">
          <option value="drehen">CNC-Drehen</option>
          <option value="drehfraesen">Dreh-Fr&auml;sbearbeitung</option>
          <option value="unsicher">Noch nicht sicher</option>
        </select>
      </div>

      <div class="assistant-grid">
        <div class="assistant-field">
          <label for="assistantMaterial">Werkstoff</label>
          <select id="assistantMaterial" name="material">
            <option value="Kunststoff">Kunststoff</option>
            <option value="Aluminium">Aluminium</option>
            <option value="Zerspanbarer Stahl">Zerspanbarer Stahl</option>
            <option value="Noch offen">Noch offen</option>
          </select>
        </div>
        <div class="assistant-field">
          <label for="assistantQuantity">Menge</label>
          <select id="assistantQuantity" name="quantity">
            <option value="Einzelteil oder Erstmuster">Einzelteil / Erstmuster</option>
            <option value="Kleinserie">Kleinserie</option>
            <option value="Wiederkehrende Serie">Wiederkehrende Serie</option>
            <option value="Noch offen">Noch offen</option>
          </select>
        </div>
      </div>

      <div class="assistant-field">
        <label for="assistantDrawing">Zeichnungsstand</label>
        <select id="assistantDrawing" name="drawing">
          <option value="Zeichnung liegt vor">Zeichnung liegt vor (PDF, DXF oder STEP)</option>
          <option value="Skizze oder Muster liegt vor">Skizze oder Muster liegt vor</option>
          <option value="Noch in Vorbereitung">Noch in Vorbereitung</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-lg">Anfrage vorbereiten</button>
      <p class="request-assistant__note">Keine Preisautomatik: Wir pr&uuml;fen Zeichnung und Machbarkeit technisch.</p>
    </form>
  </div>
</div>
