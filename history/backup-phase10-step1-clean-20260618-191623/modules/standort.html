<div class="container location-grid">
  <div class="location-map">
    <div class="map-card">
      <span class="pin pin-it">IT</span>
      <span class="pin pin-at">AT</span>
      <span class="pin pin-de">DE</span>
      <svg viewBox="0 0 520 340" role="img" aria-label="Liefergebiet Italien, Oesterreich, Deutschland">
        <path class="route route-one" d="M170 235 C230 170, 275 145, 330 112" />
        <path class="route route-two" d="M170 235 C260 205, 330 190, 405 155" />
        <circle cx="170" cy="235" r="10" />
        <circle cx="330" cy="112" r="8" />
        <circle cx="405" cy="155" r="8" />
      </svg>
      <div class="map-caption" data-key="loc_map_cap"></div>
    </div>
  </div>
  <div class="location-copy">
    <span class="kicker" data-key="loc_kicker"></span>
    <h2 class="sec-title" data-key="loc_title"></h2>
    <p class="sec-lead" data-key="loc_lead"></p>
    <div class="location-points">
      <div><b data-key="loc_p1_t"></b><span data-key="loc_p1_s"></span></div>
      <div><b data-key="loc_p2_t"></b><span data-key="loc_p2_s"></span></div>
      <div><b data-key="loc_p3_t"></b><span data-key="loc_p3_s"></span></div>
    </div>
  </div>
</div>
