<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1040" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative CAD-Arbeitsflaeche fuer ein CNC-Drehteil</title>
  <desc id="desc">Eine helle technische CAD-Ansicht mit neutraler Wellenzeichnung, Masslinien, Raster und Seitenleiste.</desc>
  <defs>
    <pattern id="minorGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d5dee4" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#minorGrid)"/>
      <path d="M160 0H0V160" fill="none" stroke="#bdc9d1" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5c6871"/>
    </marker>
    <style>
      .outline { fill: #eef3f6; stroke: #1d252d; stroke-width: 5; stroke-linejoin: round; }
      .feature { fill: none; stroke: #1d252d; stroke-width: 3; }
      .center { fill: none; stroke: #86939b; stroke-width: 2; stroke-dasharray: 20 10 3 10; }
      .dim { fill: none; stroke: #5c6871; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { fill: none; stroke: #9aa6ad; stroke-width: 2; }
      .accent { fill: none; stroke: #e3000b; stroke-width: 3; }
      .label { fill: #1d252d; font: 600 24px Arial, sans-serif; letter-spacing: 1px; }
      .small { fill: #64727b; font: 500 18px Arial, sans-serif; letter-spacing: .6px; }
      .micro { fill: #81909a; font: 600 14px Arial, sans-serif; letter-spacing: 1px; }
      .accentText { fill: #d4000a; font: 700 17px Arial, sans-serif; letter-spacing: .8px; }
    </style>
  </defs>
  <rect width="1920" height="1040" fill="#edf2f5"/>
  <rect x="0" y="0" width="1920" height="64" fill="#ffffff"/>
  <path d="M0 64H1920" stroke="#ccd6dc" stroke-width="2"/>
  <text x="72" y="40" class="label">CAD / TURNED PART / ILLUSTRATIVE</text>
  <text x="1510" y="40" class="micro">VIEW 01  |  MM  |  REV A</text>
  <rect x="0" y="64" width="1640" height="976" fill="url(#majorGrid)"/>
  <rect x="1640" y="64" width="280" height="976" fill="#f8fafb" stroke="#ccd6dc" stroke-width="2"/>

  <rect x="1682" y="112" width="194" height="34" fill="#e3000b"/>
  <text x="1700" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">PART FEATURES</text>
  <rect x="1682" y="172" width="188" height="10" fill="#cbd5db"/>
  <rect x="1682" y="196" width="144" height="10" fill="#d7dfe4"/>
  <rect x="1682" y="238" width="188" height="1" fill="#ccd6dc"/>
  <text x="1682" y="274" class="micro">MATERIAL</text>
  <rect x="1682" y="288" width="168" height="34" fill="#ffffff" stroke="#ccd6dc"/>
  <text x="1698" y="311" class="small">TO BE CHECKED</text>
  <text x="1682" y="366" class="micro">PROCESS</text>
  <rect x="1682" y="382" width="168" height="10" fill="#cbd5db"/>
  <rect x="1682" y="406" width="132" height="10" fill="#d7dfe4"/>
  <rect x="1682" y="430" width="158" height="10" fill="#d7dfe4"/>
  <rect x="1682" y="478" width="188" height="1" fill="#ccd6dc"/>
  <text x="1682" y="514" class="micro">DRAWING STATUS</text>
  <rect x="1682" y="530" width="168" height="38" fill="#ffffff" stroke="#ccd6dc"/>
  <text x="1698" y="554" class="small">TECHNICAL REVIEW</text>

  <path class="center" d="M230 550H1515"/>
  <path class="outline" d="M380 504H456V450H548V395H658V450H760V368H1186V450H1288V395H1398V450H1470V504H1530V596H1470V650H1398V705H1288V650H1186V732H760V650H658V705H548V650H456V596H380Z"/>
  <path class="feature" d="M456 504V596M548 450V650M658 450V650M760 368V732M1186 368V732M1288 450V650M1398 450V650M1470 504V596"/>
  <path class="feature" d="M895 368V732M1050 368V732"/>
  <circle cx="410" cy="550" r="24" fill="#edf2f5" stroke="#1d252d" stroke-width="5"/>
  <circle cx="1500" cy="550" r="24" fill="#edf2f5" stroke="#1d252d" stroke-width="5"/>
  <path class="feature" d="M772 404L794 426M804 404L826 426M836 404L858 426M1080 404L1102 426M1112 404L1134 426"/>

  <path class="ext" d="M380 774V850M1530 774V850"/>
  <path class="dim" d="M380 824H1530"/>
  <text x="858" y="806" class="small">OVERALL LENGTH</text>
  <text x="932" y="864" class="label">L</text>

  <path class="ext" d="M760 340V250M1186 340V250"/>
  <path class="dim" d="M760 278H1186"/>
  <text x="876" y="242" class="small">TURNING DIAMETER</text>
  <text x="962" y="310" class="label">D</text>

