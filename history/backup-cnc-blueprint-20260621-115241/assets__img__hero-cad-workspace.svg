  <text x="360" y="238" class="accentText">CROSS HOLE</text>
  <path class="accent" d="M588 230H700L760 368"/>
  <rect x="1150" y="202" width="286" height="58" fill="#ffffff" stroke="#e3000b" stroke-width="3"/>
  <text x="1172" y="238" class="accentText">MILLING FEATURE</text>
  <path class="accent" d="M1150 230H1100L1050 368"/>
  <rect x="356" y="890" width="276" height="54" fill="#ffffff" stroke="#e3000b" stroke-width="3"/>
  <text x="378" y="924" class="accentText">THREAD / GROOVE</text>
  <path class="accent" d="M632 916H710L760 732"/>
  <rect x="1184" y="890" width="252" height="54" fill="#ffffff" stroke="#e3000b" stroke-width="3"/>
  <text x="1206" y="924" class="accentText">REAR SIDE</text>
  <path class="accent" d="M1184 916H1186V732"/>

  <rect x="84" y="954" width="420" height="42" fill="#ffffff" stroke="#ccd6dc"/>
  <text x="104" y="981" class="micro">ILLUSTRATIVE CAD VIEW - NO CUSTOMER DRAWING</text>
</svg>
